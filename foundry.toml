[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.26" # matches uniswap/v4-core's exact pragma pin
optimizer = true
optimizer_runs = 200
via_ir = true # ParcelFactory.createLaunch needs this — otherwise "stack too deep"
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[rpc_endpoints]
robinhood_testnet = "https://rpc.testnet.chain.robinhood.com"
robinhood_mainnet = "https://rpc.mainnet.chain.robinhood.com"

[etherscan]
robinhood_testnet = { key = "no-api-key-needed", url = "https://explorer.testnet.chain.robinhood.com/api", chain = 46630 }
